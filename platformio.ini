; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; === WSPÓLNA KONFIGURACJA DLA WSZYSTKICH PŁYTEK ===
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.2.2
	khoih-prog/ESP_DoubleResetDetector@^1.3.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit GFX Library@^1.12.6

; === WERSJA 1: ESP32 CYD ===
[env:jczn_2432s028r]
board = jczn_2432s028r

lib_deps =
    ${env.lib_deps}          ; Pobiera wspólne biblioteki
    bodmer/TFT_eSPI@^2.5.43  ; Ta biblioteka jest tylko dla CYD
;    adafruit/Adafruit GFX Library@^1.12.6

build_flags =
	-D HARDWARE_CYD=1        ; Unikalny znacznik dla kodu C++
	-D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
	-D USE_HSPI_PORT=1
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=27000000
;	-D SPI_TOUCH_FREQUENCY=2500000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
;	-D LOAD_FONT6=1
;	-D LOAD_FONT7=1
;	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
;	-D SMOOTH_FONT=1


; === WERSJA 2: Heltec Automation WiFi LoRa 32 (v2) ===
[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
lib_deps =
    ${env.lib_deps}
	adafruit/Adafruit SSD1306
build_flags =
    -D HARDWARE_HELTEC_V2=1  ; Unikalny znacznik dla kodu C++
	-D ARDUINO_HELTEC_WIFI_LORA_32_V2=1   ; Flaga wymagana przez bibliotekę Bressera do konfiguracji pinów SX1276


; === WERSJA 3: Heltec Automation WiFi LoRa 32 (v3) ===
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
lib_deps =
    ${env.lib_deps}
;	adafruit/Adafruit SSD1306
build_flags =
    -D HARDWARE_HELTEC_V3=1  ; Unikalny znacznik dla kodu C++
	-D ARDUINO_HELTEC_WIFI_LORA_32_V3=1   ; Flaga wymagana przez bibliotekę Bressera do konfiguracji pinów SX1262
